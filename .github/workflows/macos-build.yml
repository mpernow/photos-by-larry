name: macOS build (Apple Silicon, Monterey-compatible)

# GitHub retired its macOS-12 (Monterey) hosted runner image in late 2024,
# and Homebrew's own supported-macOS window has since moved past Monterey
# too - the same wall a local `brew install qt6` hits on Monterey today.
# So this workflow doesn't use Homebrew at all: it fetches Qt's own
# official prebuilt binaries (pinned to a version whose documented minimum
# macOS is 12) and builds OpenCV from source, both explicitly targeting
# macOS 12 via CMAKE_OSX_DEPLOYMENT_TARGET. The *build* runs on a current
# macOS host (whatever macos-15 currently is); only the *output* needs to
# run on Monterey.
#
# Targets Apple Silicon (arm64) specifically, on GitHub's standard hosted
# runner tier - free and unmetered on public repos. An earlier version of
# this workflow targeted Intel instead, but every Intel macOS runner label
# GitHub offers turned out to be its paid "larger runners" tier (requires
# a payment method even on public repos) - there's no standard/free Intel
# option anymore. arm64 still has one.
#
# Runs on request rather than every push, since the OpenCV-from-source step
# alone takes several minutes even with caching on a miss - trigger it from
# the Actions tab, or push a `v*` tag.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    # Standard (free-on-public-repos) Apple Silicon runner - no cross-
    # compilation. macos-14 is marked deprecated in actions/runner-images;
    # macos-15 is the current GA standard-tier arm64 image. Revisit this
    # label if GitHub retires it later the same way macos-12/13 were -
    # check actions/runner-images for the current standard (unsuffixed,
    # not "-large"/"-xlarge") arm64 label.
    runs-on: macos-15

    env:
      OPENCV_VERSION: "4.10.0"
      MACOS_DEPLOYMENT_TARGET: "12.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Official Qt binaries, not Homebrew's. 6.8 is an LTS release whose
      # documented minimum supported macOS is 12 (Monterey) - pinned by
      # exact minor version rather than a floating "6.*" so a future Qt
      # release raising that floor further can't silently break this.
      # arch is left unspecified - the action determines it from the
      # runner (arm64 here) automatically.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          host: "mac"
          target: "desktop"

      - name: Cache built OpenCV
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/opencv-install
          key: opencv-${{ env.OPENCV_VERSION }}-macos${{ env.MACOS_DEPLOYMENT_TARGET }}-arm64-v1

      # Homebrew's opencv bottle has the exact same too-new-a-minimum-macOS
      # problem Qt's does, so this builds from source instead - only the
      # three modules this project actually uses (core/imgproc/imgcodecs,
      # matching CMakeLists.txt's find_package call), statically linked so
      # there's no OpenCV .dylib to separately bundle/fix up afterward (the
      # README's macOS section previously called this out as a remaining
      # gap for a distributable build - "something like dylibbundler is the
      # common choice - or statically link OpenCV instead").
      - name: Build OpenCV from source
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "${OPENCV_VERSION}" --depth 1 https://github.com/opencv/opencv.git /tmp/opencv-src
          cmake -S /tmp/opencv-src -B /tmp/opencv-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/opencv-install" \
            -DBUILD_LIST=core,imgproc,imgcodecs \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_PERF_TESTS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_opencv_apps=OFF \
            -DBUILD_DOCS=OFF
          cmake --build /tmp/opencv-build -j "$(sysctl -n hw.ncpu)"
          cmake --install /tmp/opencv-build

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${MACOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/opencv-install" \
            -DBUILD_TESTS=OFF

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      # Copies the Qt frameworks the app actually links into the bundle and
      # rewrites their load paths - the "standard, official tool for this"
      # per the README's macOS section, just not previously wired into any
      # automated step.
      - name: Bundle Qt frameworks
        run: macdeployqt build/PhotosByLarry.app

      - name: Zip app bundle
        run: |
          cd build
          ditto -c -k --sequesterRsrc --keepParent PhotosByLarry.app PhotosByLarry-macOS-AppleSilicon.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotosByLarry-macOS-AppleSilicon
          path: build/PhotosByLarry-macOS-AppleSilicon.zip
